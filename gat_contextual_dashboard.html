
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
    GAT Contextual Explainability
</title>

<script
    type="text/javascript"
    src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js">
</script>

<style>

* {
    box-sizing: border-box;
}

.network-wrapper {
    position: relative;
    width: 100%;
    height: 410px;
}

.network-container {
    position: absolute;
    inset: 0;
}

.radial-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

.node-radial {
    position: absolute;
    width: 105px;
    height: 105px;

    transform:
        translate(
            -50%,
            -82%
        );

    pointer-events: none;
}

body {
    margin: 0;
    background: #f4f5f7;
    color: #161616;
    font-family: Arial, Helvetica, sans-serif;
}

.dashboard {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 24px;

    width: min(1700px, calc(100% - 40px));
    margin: 20px auto 60px auto;
}

.control-panel {
    position: sticky;
    top: 20px;

    align-self: start;

    background: white;
    border: 1px solid #d8d8d8;
    border-radius: 10px;

    padding: 20px;

    max-height: calc(100vh - 40px);
    overflow-y: auto;
}

.color-guide {
    margin-top: 18px;
}

.color-guide-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
}

.color-scale {
    width: 100%;
    height: 14px;

    border-radius: 4px;

    background:
        linear-gradient(
            to right,
            #1E88E5,
            #ffffff,
            #FF0051
        );
}

.color-scale-labels {
    display: flex;
    justify-content: space-between;

    margin-top: 5px;

    font-size: 11px;
    color: #666;
}


/* ==================================================
   Radial legend in control panel
   ================================================== */

.radial-guide {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #eeeeee;
}

.radial-guide-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
}

.radial-legend {
    width: 150px;
    height: 150px;

    margin:
        0
        auto;
}

.radial-guide-note {
    margin-top: 6px;

    font-size: 10px;
    line-height: 1.4;

    color: #777777;
}

.control-row {
    display: block;
}

.control-group {
    margin-bottom: 22px;
}

.prefix-control-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.prefix-control-row input[type="range"] {
    flex: 1;
    min-width: 0;
}

.prefix-step-button {
    width: 26px;
    height: 26px;

    padding: 0;

    border: 1px solid #c8c8c8;
    border-radius: 5px;

    background: #ffffff;

    font-size: 18px;
    line-height: 1;

    cursor: pointer;
}

.prefix-step-button:hover {
    background: #f0f0f0;
}





.color-guide {
    margin-top: 28px;
    display: block;
}

.color-scale {
    width: 100%;
    height: 13px;
    margin: 7px 0;

    border: 1px solid #aaa;
    border-radius: 7px;

    background: linear-gradient(
        to right,
        #008BFB,
        #C8E6FF,
        #FFFFFF,
        #FFD0DA,
        #FF0051
    );
}

#views {
    min-width: 0;
}

.scale-label {
    font-size: 11px;
    color: #555;
}

.view-card {
    background: white;
    border: 1px solid #d8d8d8;
    border-radius: 10px;
    margin-bottom: 28px;
    overflow: hidden;
}

.view-header {
    padding: 15px 20px;
    border-bottom: 1px solid #e4e4e4;
}

.view-title {
    font-size: 18px;
    font-weight: 700;
}

.view-subtitle {
    margin-top: 3px;
    color: #777;
    font-size: 12px;
}

.view-content {
    display: block;
    min-height: 420px;
}

.diagram-area {
    position: relative;
    min-height: 420px;
    padding: 10px;
}

.network-container {
    width: 100%;
    height: 410px;
}

.radial-area {
    border-left: 1px solid #eee;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.radial-empty {
    color: #aaa;
    font-size: 12px;
}

.timeline {
    position: relative;
    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    cursor: grab;
}

.timeline:active {
    cursor: grabbing;
}

.timeline-track {
    position: relative;

    width: 100%;
    min-width: 100%;

    min-height: 1000px;
}

.timeline-main-axis {
    position: absolute;
    left: 5%;
    right: 5%;
    height: 2px;
    background: #bfc3c7;
}

.timeline-event-connector {
    position: absolute;
    width: 1px;
    transform: translateX(-50%);
}

.timeline-event {
    position: absolute;
    transform: translateX(-50%);
    z-index: 3;
}

.timeline-radial {
    position: absolute;
    transform: translateX(-50%);
    z-index: 4;
}

.timeline-line {
    position: absolute;
    height: 3px;
    background: #777;
}

.timeline-box {
    width: 14px;
    height: 14px;

    border: 2px solid #333;
    border-radius: 50%;

    background: white;

    margin-left: auto;
    margin-right: auto;
}

.timeline-event-label {
    margin-top: 5px;

    white-space: nowrap;

    font-size: 11px;
    font-weight: 600;

    text-align: center;
}

.timeline-axis-time-label {
    position: absolute;

    transform: translateX(-50%);

    font-size: 10px;

    color: #666;

    white-space: nowrap;

    z-index: 2;
}

.timeline-duration-label {
    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    font-size: 9px;

    color: #777;

    white-space: nowrap;

    text-align: center;
}


.remaining-marker {
    position: absolute;
    right: 25px;
    top: 20px;
    padding: 8px 14px;
    border: 4px solid #111;
    background: white;
    font-weight: 700;
    font-size: 13px;
}

.predicted-node {
    border-color: #111 !important;
    border-width: 5px !important;
}

@media (
    max-width: 1000px
) {

    .control-row {
        grid-template-columns: 1fr;
    }

    .view-content {
        grid-template-columns: 1fr;
    }

    .radial-area {
        border-left: 0;
        border-top: 1px solid #eee;
    }
}

</style>

</head>


<body>

<div class="dashboard">

    <div class="control-panel">

        <div class="control-row">

            <div class="control-group">
                <label>Prediction task</label>
                <select id="taskSelector"></select>
            </div>

            <div class="control-group">
                <label>Variant</label>
                <select id="variantSelector"></select>
            </div>

            <div class="control-group">

                <div class="prefix-header">
                    <label>Prefix</label>

                    <span
                        class="prefix-value"
                        id="prefixValue">
                        1
                    </span>
                </div>

                <div class="prefix-control-row">

                    <button
                        id="prefixMinus"
                        class="prefix-step-button"
                        type="button">
                        −
                    </button>

                    <input
                        id="prefixSlider"
                        type="range"
                        min="1"
                        max="1"
                        value="1"
                        step="1"
                    >

                    <button
                        id="prefixPlus"
                        class="prefix-step-button"
                        type="button">
                        +
                    </button>

                </div>

            </div>

        </div>

        <div class="color-guide">

            <div class="color-guide-title">
                Attribution
            </div>

            <div class="color-scale"></div>

            <div class="color-scale-labels">
                    <span>
                        Negative
                    </span>

                    <span>
                        0
                    </span>

                    <span>
                        Positive
                    </span>
                </div>

            </div>

        <div class="radial-guide">

            <div class="radial-guide-title">
                Radial feature attribution
            </div>

            <div
                id="radialLegend"
                class="radial-legend">
            </div>

            <div class="radial-guide-note">
                Distance from the center represents attribution magnitude. 
                Red indicates positive contributions (white zone), while blue indicates negative contributions (gray zone).
            </div>

        </div>
    </div>
    <div id="views"></div>

</div>

/* ==================================================
   SHAP-style colour
================================================== */

function hexToRgb(
    hex
) {
    const value =
        hex.replace(
            "#",
            ""
        );

    return {
        r:
            parseInt(
                value.substring(
                    0,
                    2
                ),
                16
            ),

        g:
            parseInt(
                value.substring(
                    2,
                    4
                ),
                16
            ),

        b:
            parseInt(
                value.substring(
                    4,
                    6
                ),
                16
            )
    };
}


function blendWithWhite(
    hex,
    strength
) {
    const rgb =
        hexToRgb(
            hex
        );

    const s =
        Math.min(
            Math.max(
                strength,
                0
            ),
            1
        );

    const r =
        Math.round(
            255
            + (
                rgb.r - 255
            ) * s
        );

    const g =
        Math.round(
            255
            + (
                rgb.g - 255
            ) * s
        );

    const b =
        Math.round(
            255
            + (
                rgb.b - 255
            ) * s
        );

    return (
        `rgb(${r},${g},${b})`
    );
}

function blendWithBlack(
    hex,
    strength
) {
    const rgb =
        hexToRgb(
            hex
        );

    const s =
        Math.min(
            Math.max(
                strength,
                0
            ),
            1
        );

    const r =
        Math.round(
            rgb.r * s
        );

    const g =
        Math.round(
            rgb.g * s
        );

    const b =
        Math.round(
            rgb.b * s
        );

    return (
        `rgb(${r},${g},${b})`
    );
}


function getTaskMaxAbs(
    taskData
) {
    let values = [];

    Object.values(
        taskData
    ).forEach(
        view => {

            if (
                view.events
            ) {
                view.events.forEach(
                    item => {
                        values.push(
                            Math.abs(
                                Number(
                                    item.importance
                                    || 0
                                )
                            )
                        );
                    }
                );
            }

            if (
                view.nodes
            ) {
                view.nodes.forEach(
                    item => {
                        values.push(
                            Math.abs(
                                Number(
                                    item.importance
                                    || 0
                                )
                            )
                        );
                    }
                );
            }

            if (
                view.sequence_edges
            ) {
                view.sequence_edges.forEach(
                    edge => {
                        values.push(
                            Math.abs(
                                Number(
                                    edge.importance
                                    || 0
                                )
                            )
                        );
                    }
                );
            }
        }
    );

    const maxAbs =
        Math.max(
            ...values,
            1e-9
        );

    return maxAbs;
}


function attributionColor(
    value,
    maxAbs
) {
    const numeric =
        Number(
            value || 0
        );

    const strength =
        Math.min(
            Math.abs(
                numeric
            )
            / maxAbs,
            1
        );

    const baseColor =
        numeric < 0
            ? "#008BFB"
            : numeric > 0
                ? "#FF0051"
                : "#FFFFFF";

    return blendWithWhite(
        baseColor,
        strength
    );
}

function edgeAttributionColor(
    value,
    maxAbs
) {
    const numeric =
        Number(
            value || 0
        );

    const safeMaxAbs =
        Math.max(
            Number(maxAbs) || 0,
            1e-12
        );

    const strength =
        Math.min(
            Math.abs(
                numeric
            )
            / safeMaxAbs,
            1
        );

    const targetColor =
        numeric < 0
            ? "#008BFB"
            : numeric > 0
                ? "#FF0051"
                : "#000000";

    return blendWithBlack(
        targetColor,
        strength
    );
}

        );

    Object.entries(

    ).forEach(
        ([id, variant]) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                id;

            option.textContent =
                `Variant ${id} — `
                + `${variant.percentage.toFixed(2)}%`;

            variantSelector.appendChild(
                option
            );
        }
    );


    taskSelector.addEventListener(
        "change",
        event => {

            state.task =
                event.target.value;

            updateDashboard();
        }
    );


    variantSelector.addEventListener(
        "change",
        event => {

            state.variant =
                event.target.value;

            setSliderForVariant();

            updateDashboard();
        }
    );


    const slider =
        document.getElementById(
            "prefixSlider"
        );

    const minusButton =
        document.getElementById(
            "prefixMinus"
        );

    const plusButton =
        document.getElementById(
            "prefixPlus"
        );

    slider.addEventListener(
        "input",
        event => {

            state.prefix =
                Number(
                    event.target.value
                );

            document.getElementById(
                "prefixValue"
            ).textContent =
                state.prefix;

            updateDashboard();
        }
    );

    minusButton.addEventListener(
        "click",
        () => {

            const minValue =
                Number(
                    slider.min
                );

            const newValue =
                Math.max(
                    Number(
                        slider.value
                    ) - 1,
                    minValue
                );

            slider.value =
                newValue;

            state.prefix =
                newValue;

            document.getElementById(
                "prefixValue"
            ).textContent =
                state.prefix;

            updateDashboard();
        }
    );


    plusButton.addEventListener(
        "click",
        () => {

            const maxValue =
                Number(
                    slider.max
                );

            const newValue =
                Math.min(
                    Number(
                        slider.value
                    ) + 1,
                    maxValue
                );

            slider.value =
                newValue;

            state.prefix =
                newValue;

            document.getElementById(
                "prefixValue"
            ).textContent =
                state.prefix;

            updateDashboard();
        }
    );


    setSliderForVariant();
}


function setSliderForVariant() {

    const variant =
        getVariant();

    const prefixes =
        Object.keys(
            variant.prefixes
        )
        .map(Number)
        .sort(
            (a, b) =>
                a - b
        );

    const slider =
        document.getElementById(
            "prefixSlider"
        );

    slider.min =
        prefixes[0];

    slider.max =
        prefixes[
            prefixes.length - 1
        ];

    state.prefix =
        prefixes[0];

    slider.value =
        state.prefix;

    document.getElementById(
        "prefixValue"
    ).textContent =
        state.prefix;
}

function renderActivityNodeRadials(
    network,
    overlay,
    data
) {
    overlay.innerHTML = "";

    const latestOccurrence =
        getLatestOccurrences(
            data.events
        );

    Object.entries(
        latestOccurrence
    ).forEach(
        ([activity, event]) => {

            const positions =
                network.getPositions(
                    [activity]
                );

            const networkPosition =
                positions[
                    activity
                ];

            if (!networkPosition) {
                return;
            }

            const domPosition =
                network.canvasToDOM(
                    networkPosition
                );

            const contextFeatures =
                data.context_by_position[
                    String(
                        event.position
                    )
                ] || [];


            const radialContainer =
                document.createElement(
                    "div"
                );

            radialContainer.className =
                "node-radial";

            radialContainer.style.left =
                `${domPosition.x}px`;

            radialContainer.style.top =
                `${domPosition.y - 18}px`;

            overlay.appendChild(
                radialContainer
            );
        

            renderRadialPlot(
                radialContainer,
                contextFeatures,
                95
            );
        }
    );
}


function renderRadialPlot(
    container,
    features,
    size = 280
) {

    container.innerHTML =
        "";

    if (
        !features
        || !features.length
    ) {
        container.innerHTML =
            '<div class="radial-empty">'
            + 'No relevant context features'
            + '</div>';

        return;
    }


    const center =
        size / 2;

    const outerRadius =
        size * 0.27;

    const zeroRadius =
        size * 0.16;

    const innerRadius =
        size * 0.05;;

    const maxAbs =
        Math.max(
            ...features.map(
                feature =>
                    Math.abs(
                        Number(
                            feature.importance
                            || 0
                        )
                    )
            ),
            1e-9
        );


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svg.setAttribute(
        "width",
        size
    );

    svg.setAttribute(
        "height",
        size
    );


    const outer =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    outer.setAttribute(
        "cx",
        center
    );

    outer.setAttribute(
        "cy",
        center
    );

    outer.setAttribute(
        "r",
        outerRadius
    );

    outer.setAttribute(
        "fill",
        "#ffffff"
    );

    outer.setAttribute(
        "stroke",
        "#dddddd"
    );

    svg.appendChild(
        outer
    );


    const negativeArea =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    negativeArea.setAttribute(
        "cx",
        center
    );

    negativeArea.setAttribute(
        "cy",
        center
    );

    negativeArea.setAttribute(
        "r",
        zeroRadius
    );

    negativeArea.setAttribute(
        "fill",
        "#f0f0f0"
    );

    negativeArea.setAttribute(
        "stroke",
        "#999999"
    );

    negativeArea.setAttribute(
        "stroke-dasharray",
        "3,3"
    );

    svg.appendChild(
        negativeArea
    );


    features.forEach(
        (feature, index) => {

            const angle =
                (
                    Math.PI * 2
                    * index
                    / features.length
                )
                - Math.PI / 2;

            const value =
                Number(
                    feature.importance
                    || 0
                );

            const normalized =
                Math.min(
                    Math.abs(
                        value
                    )
                    / maxAbs,
                    1
                );

            let radius;

            if (
                value >= 0
            ) {
                radius =
                    zeroRadius
                    + normalized
                    * (
                        outerRadius
                        - zeroRadius
                    );
            }
            else {
                radius =
                    zeroRadius
                    - normalized
                    * (
                        zeroRadius
                        - innerRadius
                    );
            }


            const axisEndX =
                center
                + Math.cos(
                    angle
                )
                * outerRadius;

            const axisEndY =
                center
                + Math.sin(
                    angle
                )
                * outerRadius;


            const axis =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            axis.setAttribute(
                "x1",
                center
            );

            axis.setAttribute(
                "y1",
                center
            );

            axis.setAttribute(
                "x2",
                axisEndX
            );

            axis.setAttribute(
                "y2",
                axisEndY
            );

            axis.setAttribute(
                "stroke",
                "#d0d0d0"
            );

            svg.appendChild(
                axis
            );


            const dotX =
                center
                + Math.cos(
                    angle
                )
                * radius;

            const dotY =
                center
                + Math.sin(
                    angle
                )
                * radius;


            const dot =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            dot.setAttribute(
                "cx",
                dotX
            );

            dot.setAttribute(
                "cy",
                dotY
            );

            dot.setAttribute(
                "r",
                size < 150
                    ? 3.5
                    : 6
            );

            dot.setAttribute(
                "fill",
                value >= 0
                    ? "#FF0051"
                    : "#008BFB"
            );

            svg.appendChild(
                dot
            );


            const labelRadius =
                outerRadius + 5;

            const labelX =
                center
                + Math.cos(
                    angle
                )
                * labelRadius;

            const labelY =
                center
                + Math.sin(
                    angle
                )
                * labelRadius;


            const label =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            label.setAttribute(
                "x",
                labelX
            );

            label.setAttribute(
                "y",
                labelY
            );

            label.setAttribute(
                "text-anchor",
                "middle"
            );

            label.setAttribute(
                "dominant-baseline",
                "middle"
            );

            label.setAttribute(
                "font-size",
                "9"
            );

            label.textContent =
                feature.name;

            svg.appendChild(
                label
            );
        }
    );

    
    container.appendChild(
        svg
    );
}

/* ==================================================
   Activity DFG - fixed discovery structure
================================================== */

function getObservedActivityMap(data) {
    const observed = new Map();
    (data.events || []).forEach(event => {
        observed.set(event.activity, event);
    });
    return observed;
}

function getObservedActivityEdges(data) {
    const edges = new Set();
    const events = data.events || [];
    for (let index = 0; index < events.length - 1; index++) {
        edges.add(`${events[index].activity}__to__${events[index + 1].activity}`);
    }
    return edges;
}

function buildActivityNetwork(container, overlay) {
    const structure =
        DATA.discovery.activity
        || {nodes: [], edges: []};

    // ---------------------------------------------------------
    // 1. Find the most frequent variant = happy path
    // ---------------------------------------------------------

    const variants =
        Object.values(
            DATA.variants || {}
        );

    const happyVariant =
        variants.reduce(
            (best, variant) => {
                if (
                    !best
                    || variant.percentage
                        > best.percentage
                ) {
                    return variant;
                }

                return best;
            },
            null
        );

    const happyPath =
        happyVariant
            ? (
                happyVariant.activity_sequence
                || []
            )
            : [];

    console.log(
        "Happy variant:",
        happyVariant
    );

    console.log(
        "Happy path:",
        happyPath
    );


    // ---------------------------------------------------------
    // 2. Assign a horizontal level to happy-path activities
    // ---------------------------------------------------------

    const happyPathLevels =
        new Map();

    happyPath.forEach(
        (activity, index) => {
            happyPathLevels.set(
                activity,
                index
            );
        }
    );


    // ---------------------------------------------------------
    // 3. Infer levels for activities outside the happy path
    //
    // Start from happy-path levels and propagate levels through
    // the DFG. This keeps deviations close to the point where
    // they branch from the main process.
    // ---------------------------------------------------------

    const activityLevels =
        new Map(
            happyPathLevels
        );

    const edges =
        structure.edges || [];

    let changed = true;
    let iterations = 0;

    while (
        changed
        && iterations < 20
    ) {
        changed = false;
        iterations += 1;

        edges.forEach(edge => {
            const sourceLevel =
                activityLevels.get(
                    edge.source
                );

            const targetLevel =
                activityLevels.get(
                    edge.target
                );

            // If source has a level but target does not,
            // place target one level later.
            if (
                sourceLevel !== undefined
                && targetLevel === undefined
            ) {
                activityLevels.set(
                    edge.target,
                    sourceLevel + 1
                );

                changed = true;
            }

            // If target has a level but source does not,
            // place source one level earlier.
            else if (
                targetLevel !== undefined
                && sourceLevel === undefined
            ) {
                activityLevels.set(
                    edge.source,
                    Math.max(
                        0,
                        targetLevel - 1
                    )
                );

                changed = true;
            }
        });
    }


    // ---------------------------------------------------------
    // 4. Fallback for disconnected/unresolved activities
    // ---------------------------------------------------------

    const fallbackLevel =
        happyPath.length;

    (
        structure.nodes || []
    ).forEach(activity => {
        if (
            !activityLevels.has(
                activity
            )
        ) {
            activityLevels.set(
                activity,
                fallbackLevel
            );
        }
    });


    // ---------------------------------------------------------
    // 5. Create activity nodes
    // ---------------------------------------------------------

    activityNodes =
        new vis.DataSet(
            (
                structure.nodes || []
            ).map(activity => ({

                id: activity,

                label: activity,

                shape: "box",

                level:
                    activityLevels.get(
                        activity
                    ),

                color: {
                    background: "#D9DDE2",
                    border: "#666666"
                },

                borderWidth: 1,

                font: {
                    size: 15,
                    color: "#111111"
                },

                margin: 14,

                physics: false
            }))
        );


    // ---------------------------------------------------------
    // 6. Create DFG edges
    // ---------------------------------------------------------

    activityEdges =
        new vis.DataSet(
            edges.map(
                (edge, index) => ({

                    id:
                        `${edge.source}__to__${edge.target}`,

                    from:
                        edge.source,

                    to:
                        edge.target,

                    arrows:
                        "to",

                    label:
                        edge.count !== undefined
                            ? String(
                                edge.count
                            )
                            : "",

                    color: {
                        color: "#c6c9cd"
                    },

                    width: 1,

                    font: {
                        size: 10,
                        color: "#999999"
                    }
                })
            )
        );


    // ---------------------------------------------------------
    // 7. Create hierarchical network
    // ---------------------------------------------------------

    activityNetwork =
        new vis.Network(
            container,

            {
                nodes:
                    activityNodes,

                edges:
                    activityEdges
            },

            {
                physics: {
                    enabled: false
                },

                layout: {
                    hierarchical: {
                        enabled: true,

                        direction: "LR",

                        sortMethod: "directed",

                        levelSeparation: 350,

                        nodeSpacing: 130,

                        treeSpacing: 260,

                        blockShifting: true,

                        edgeMinimization: true,

                        parentCentralization: true
                    }
                },

                interaction: {
                    hover: false,
                    dragNodes: false
                },

                edges: {
                    smooth: {
                        enabled: true,

                        type: "cubicBezier",

                        forceDirection:
                            "horizontal",

                        roundness: 0.35
                    }
                }
            }
        );


    // ---------------------------------------------------------
    // 8. Store overlay
    // ---------------------------------------------------------

    activityOverlay =
        overlay;


    // ---------------------------------------------------------
    // 9. Refresh radial plots
    // ---------------------------------------------------------

    const refresh = () => {
        const taskData =
            getTaskData();

        if (
            taskData
            && taskData.activity
        ) {
            renderActivityNodeRadials(
                activityNetwork,
                activityOverlay,
                taskData.activity
            );
        }
    };


    activityNetwork.once(
        "afterDrawing",
        refresh
    );

    activityNetwork.on(
        "zoom",
        refresh
    );

    activityNetwork.on(
        "dragEnd",
        refresh
    );

    setTimeout(
        refresh,
        100
    );
}

function updateActivityView(data, prefix, maxAbs) {
    if (!activityNetwork || !activityNodes || !data) {
        return;
    }

    const observed = getObservedActivityMap(data);
    const prediction = prefix.predictions["next_activity"];
    const predictedActivity = prediction ? prediction.predicted : null;
    const showPrediction = state.task === "next_activity";

    const updates = activityNodes.get().map(node => {
        const event = observed.get(node.id);
        const isObserved = event !== undefined;
        const isPredicted =
            showPrediction
            && predictedActivity
            && node.id === predictedActivity;

        return {
            id: node.id,
            label: isPredicted
                ? node.id + "\nPredicted next"
                : node.id,
            color: {
                background: isObserved
                    ? attributionColor(event.importance, maxAbs)
                    : "#D9DDE2",
                border: isPredicted ? "#000000" : "#666666"
            },
            borderWidth: isPredicted ? 6 : (isObserved ? 3 : 1),
            font: {
                size: isPredicted ? 17 : 15,
                color: "#111111"
            }
        };
    });

    activityNodes.update(updates);

    const observedEdges = getObservedActivityEdges(data);
    const edgeUpdates = activityEdges.get().map(edge => {
        const isObserved = observedEdges.has(edge.id);
        return {
            id: edge.id,
            color: {color: isObserved ? "#333333" : "#c6c9cd"},
            width: isObserved ? 3 : 1,
            font: {
                size: isObserved ? 12 : 10,
                color: isObserved ? "#555555" : "#aaaaaa"
            }
        };
    });
    activityEdges.update(edgeUpdates);

    renderActivityNodeRadials(
        activityNetwork,
        activityOverlay,
        data
    );
}


/* ==================================================
   Resource network - fixed discovery structure
================================================== */

function getLatestResourceOccurrences(resourceSequence) {
    const latest = {};
    (resourceSequence || []).forEach(item => {
        latest[item.resource] = item;
    });
    return latest;
}

function renderResourceNodeRadials(network, overlay, data) {
    overlay.innerHTML = "";

    const latestOccurrence = getLatestResourceOccurrences(
        data.resource_sequence || []
    );

    Object.entries(latestOccurrence).forEach(
        ([resource, item]) => {
            const positions = network.getPositions([resource]);
            const networkPosition = positions[resource];
            if (!networkPosition) {
                return;
            }

            const domPosition = network.canvasToDOM(networkPosition);
            const contextFeatures =
                data.context_by_position[String(item.position)] || [];

            if (!contextFeatures.length) {
                return;
            }

            const radialContainer = document.createElement("div");
            radialContainer.className = "node-radial";
            radialContainer.style.left = `${domPosition.x}px`;
            radialContainer.style.top = `${domPosition.y - 18}px`;
            overlay.appendChild(radialContainer);

            renderRadialPlot(
                radialContainer,
                contextFeatures,
                95
            );
        }
    );
}

function getObservedResourceEdges(data) {
    const edges = new Set();
    const seq = data.resource_sequence || [];
    for (let index = 0; index < seq.length - 1; index++) {
        const source = seq[index].resource;
        const target = seq[index + 1].resource;
        if (source !== target) {
            edges.add(`${source}__to__${target}`);
        }
    }
    return edges;
}

function buildResourceNetwork(container, overlay) {
    const structure =
        DATA.discovery.resource ||
        {nodes: [], edges: []};

    // ==================================================
    // Build resource nodes with fixed circular positions
    // ==================================================

    resourceNodes = new vis.DataSet(
        (structure.nodes || []).map(
            (resource, index, allResources) => {

                const id =
                    typeof resource === "string"
                        ? resource
                        : String(
                            resource.id ??
                            resource.label
                        );

                const label =
                    typeof resource === "string"
                        ? resource
                        : String(
                            resource.label ??
                            resource.id
                        );

                const totalResources =
                    allResources.length;

                const ringCount =
                    totalResources > 40
                        ? 3
                        : totalResources > 18
                            ? 2
                            : 1;

                const resourcesPerRing =
                    Math.ceil(
                        totalResources / ringCount
                    );

                const ringIndex =
                    Math.floor(
                        index / resourcesPerRing
                    );

                const indexInRing =
                    index % resourcesPerRing;

                const currentRingSize =
                    Math.min(
                        resourcesPerRing,
                        totalResources -
                            (
                                ringIndex *
                                resourcesPerRing
                            )
                    );

                const baseRadius = 180;

                const ringSpacing = 190;

                const radius =
                    baseRadius +
                    (
                        ringIndex *
                        ringSpacing
                    );

                const angle =
                    (
                        2 * Math.PI *
                        indexInRing
                    ) / currentRingSize;

                const x =
                    radius *
                    Math.cos(angle);

                const y =
                    radius *
                    Math.sin(angle);
                return {
                    id,
                    label,
                    shape: "dot",
                    size: 25,

                    x,
                    y,

                    fixed: {
                        x: true,
                        y: true
                    },

                    physics: false,

                    color: {
                        background: "#D9DDE2",
                        border: "#666666"
                    },

                    borderWidth: 1,

                    font: {
                        size: 14,
                        color: "#111111"
                    }
                };
            }
        )
    );

    // ==================================================
    // Build resource edges
    // ==================================================

    resourceEdges = new vis.DataSet(
        (structure.edges || []).map(
            edge => ({
                id:
                    `${edge.source}__to__${edge.target}`,

                from:
                    String(edge.source),

                to:
                    String(edge.target),

                arrows: "to",

                label:
                    edge.count !== undefined
                        ? String(edge.count)
                        : "",

                color: {
                    color: "#c6c9cd"
                },

                width: 1,

                font: {
                    size: 10,
                    color: "#999999"
                }
            })
        )
    );

    // ==================================================
    // Create network
    // ==================================================

    resourceNetwork = new vis.Network(
        container,

        {
            nodes: resourceNodes,
            edges: resourceEdges
        },

        {
            physics: {
                enabled: false
            },

            interaction: {
                hover: false,
                dragNodes: false
            },

            edges: {
                smooth: {
                    enabled: true
                }
            }
        }
    );

    resourceOverlay = overlay;

    // ==================================================
    // Initial fit and radial rendering
    // ==================================================

    resourceNetwork.once(
        "afterDrawing",
        () => {

            resourceNetwork.fit({
                animation: false
            });

            const taskData =
                getTaskData();

            if (
                taskData &&
                taskData.resource
            ) {
                renderResourceNodeRadials(
                    resourceNetwork,
                    resourceOverlay,
                    taskData.resource
                );
            }
        }
    );

    // ==================================================
    // Refresh radials after interaction
    // ==================================================

    const refresh = () => {
        const taskData =
            getTaskData();

        if (
            taskData &&
            taskData.resource
        ) {
            renderResourceNodeRadials(
                resourceNetwork,
                resourceOverlay,
                taskData.resource
            );
        }
    };

    resourceNetwork.on(
        "zoom",
        refresh
    );

    resourceNetwork.on(
        "dragEnd",
        refresh
    );
}

function updateResourceView(data, prefix, maxAbs) {
    if (!resourceNetwork || !resourceNodes || !data) {
        return;
    }

    const currentNodes = new Map(
        (data.nodes || []).map(node => [String(node.id), node])
    );

    const prediction = prefix.predictions["next_resource"];
    const predictedResource = prediction ? String(prediction.predicted) : null;
    const showPrediction = state.task === "next_resource";

    const updates = resourceNodes.get().map(node => {
        const attribution = currentNodes.get(String(node.id));
        const isObserved = attribution !== undefined;
        const isPredicted =
            showPrediction
            && predictedResource
            && String(node.id) === predictedResource;

        return {
            id: node.id,
            label: isPredicted
                ? String(node.id) + "\nPredicted next"
                : String(node.id),
            size: isPredicted ? 32 : 25,
            color: {
                background: isObserved
                    ? attributionColor(attribution.importance, maxAbs)
                    : "#D9DDE2",
                border: isPredicted ? "#000000" : "#666666"
            },
            borderWidth: isPredicted ? 6 : (isObserved ? 3 : 1)
        };
    });
    resourceNodes.update(updates);

    const observedEdges = getObservedResourceEdges(data);
    const edgeUpdates = resourceEdges.get().map(edge => {
        const isObserved = observedEdges.has(edge.id);
        return {
            id: edge.id,
            color: {color: isObserved ? "#444444" : "#c6c9cd"},
            width: isObserved ? 3 : 1,
            font: {
                size: isObserved ? 12 : 10,
                color: isObserved ? "#555555" : "#aaaaaa"
            }
        };
    });
    resourceEdges.update(edgeUpdates);

    renderResourceNodeRadials(
        resourceNetwork,
        resourceOverlay,
        data
    );
}


/* ==================================================
   Timeline
================================================== */

function formatDuration(milliseconds) {
    const minutes =
        milliseconds / 60000;

    if (minutes < 60) {
        return `${Math.round(minutes)} min`;
    }

    const hours =
        minutes / 60;

    if (hours < 24) {
        return `${hours.toFixed(1)} h`;
    }

    const days =
        hours / 24;

    return `${days.toFixed(1)} d`;
}


function formatTimelineTime(
    timestamp
) {
    const date =
        new Date(
            timestamp
        );

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function renderTimeline(
    container,
    data,
    maxAbs,
    prefix,
    remainingPrediction
) {

    container.innerHTML = "";

    const timeline =
        document.createElement(
            "div"
        );

    timeline.className =
        "timeline";


    const track =
        document.createElement(
            "div"
        );

    track.className =
        "timeline-track";

    // ==================================================
    // Timeline zoom
    // ==================================================

    const timelineZoom =
        state.timelineZoom || 1;

    track.style.width =
        `${timelineZoom * 100}%`;

    timeline.appendChild(
        track
    );


    // ==================================================
    // Remaining-time prediction
    // ==================================================

    if (
        state.task === "remaining_time"
        &&
        remainingPrediction !== undefined
        &&
        remainingPrediction !== null
    ) {
        const marker =
            document.createElement(
                "div"
            );

        marker.className =
            "remaining-marker";

        const remainingHours =
            Number(remainingPrediction)
            / 3600.0;

        marker.textContent =
            `Predicted remaining: `
            + `${remainingHours.toFixed(2)} h`;

        timeline.appendChild(
            marker
        );
    }


    // ==================================================
    // Complete case
    // ==================================================

    const variant =
        getVariant();

    const timelineStructure =
        variant.timeline_structure
        || {
            events: []
        };

    const fullEvents =
        timelineStructure.events
        || [];


    if (!fullEvents.length) {
        container.appendChild(
            timeline
        );

        return;
    }


    // ==================================================
    // Observed-event lookup
    // ==================================================

    const currentEventMap =
        new Map();

    (data.events || []).forEach(
        event => {
            currentEventMap.set(
                Number(
                    event.position
                ),
                event
            );
        }
    );

    // ==================================================
    // Consecutive temporal-edge lookup
    // ==================================================

    const sequenceEdgeMap =
        new Map();

    (
        data.sequence_edges
        || []
    ).forEach(
        edge => {
            const key =
                `${
                    Number(
                        edge.source_pos
                    )
                }-${
                    Number(
                        edge.target_pos
                    )
                }`;

            sequenceEdgeMap.set(
                key,
                edge
            );
        }
    );

    // ==================================================
    // Visible events: observed prefix only
    // ==================================================

    const visibleEvents =
        fullEvents.filter(
            event =>
                currentEventMap.has(
                    Number(
                        event.position
                    )
                )
        );


    // ==================================================
    // Timestamp scale
    // ==================================================

    const timestamps =
        visibleEvents.map(
            event => {
                if (!event.timestamp) {
                    return NaN;
                }

                return new Date(
                    event.timestamp
                ).getTime();
            }
        );


    const validTimestamps =
        timestamps.filter(
            value =>
                Number.isFinite(
                    value
                )
        );


    const hasRealTime =
        validTimestamps.length >= 2;


    const startTime =
        hasRealTime
            ? Math.min(
                ...validTimestamps
            )
            : 0;


    const endTime =
        hasRealTime
            ? Math.max(
                ...validTimestamps
            )
            : 1;


    const totalDuration =
        Math.max(
            endTime - startTime,
            1
        );


    function positionFor(
        index
    ) {
        const timestamp =
            timestamps[index];

        if (
            hasRealTime
            &&
            Number.isFinite(
                timestamp
            )
        ) {
            return (
                (
                    timestamp - startTime
                )
                / totalDuration
                * 90
                + 5
            );
        }

        if (
            visibleEvents.length === 1
        ) {
            return 50;
        }

        return (
            index
            / (
                visibleEvents.length - 1
            )
            * 90
            + 5
        );
    }


    // ==================================================
    // Lane assignment
    // ==================================================

    const laneOrder = [
        1,
        -1,
        2,
        -2,
        3,
        -3,
        4,
        -4
    ];

    const laneLastX =
        new Map();

    laneOrder.forEach(
        lane => {
            laneLastX.set(
                lane,
                -Infinity
            );
        }
    );


    const minLaneSeparation = 30;


    function assignLane(
        x
    ) {
        for (
            const lane
            of laneOrder
        ) {
            const previousX =
                laneLastX.get(
                    lane
                );

            if (
                x - previousX
                >= minLaneSeparation
            ) {
                laneLastX.set(
                    lane,
                    x
                );

                return lane;
            }
        }


        let bestLane =
            laneOrder[0];

        let largestDistance =
            -Infinity;


        for (
            const lane
            of laneOrder
        ) {
            const previousX =
                laneLastX.get(
                    lane
                );

            const distance =
                x - previousX;

            if (
                distance
                > largestDistance
            ) {
                largestDistance =
                    distance;

                bestLane =
                    lane;
            }
        }


        laneLastX.set(
            bestLane,
            x
        );

        return bestLane;
    }


    // ==================================================
    // Vertical layout
    // ==================================================

    const centerY = 470;
    const firstLaneOffset = 100;
    const laneSpacing = 140;


    function eventTopForLane(
        lane
    ) {
        const distance =
            firstLaneOffset
            + (
                Math.abs(lane) - 1
            ) * laneSpacing;

        if (lane > 0) {
            return (
                centerY
                - distance
            );
        }

        return (
            centerY
            + distance
        );
    }


    function radialTopForLane(
        lane
    ) {
        const eventTop =
            eventTopForLane(
                lane
            );

        if (
            lane > 0
        ) {
            return eventTop - 85;
        }

        return eventTop +30;
    }


    // ==================================================
    // Central axis
    // ==================================================

    const axis =
        document.createElement(
            "div"
        );

    axis.className =
        "timeline-main-axis";

    axis.style.top =
        `${centerY}px`;

    track.appendChild(
        axis
    );


    // ==================================================
    // Draw events
    // ==================================================

    for (
        let index = 0;
        index < visibleEvents.length;
        index++
    ) {
        const fullEvent =
            visibleEvents[index];

        const position =
            Number(
                fullEvent.position
            );

        const currentEvent =
            currentEventMap.get(
                position
            );

        const observed =
            currentEvent !== undefined;


        const x =
            positionFor(
                index
            );

        const lane =
            assignLane(
                x
            );

        const eventTop =
            eventTopForLane(
                lane
            );

        const timestamp =
            timestamps[index];


        // ----------------------------------------------
        // Connector
        // ----------------------------------------------

        const connector =
            document.createElement(
                "div"
            );

        connector.className =
            "timeline-event-connector";

        connector.style.left =
            `${x}%`;


        const connectorTop =
            Math.min(
                centerY,
                eventTop
            );

        const connectorHeight =
            Math.abs(
                eventTop - centerY
            );


        connector.style.top =
            `${connectorTop}px`;

        connector.style.height =
            `${connectorHeight}px`;

        connector.style.background =
            observed
                ? "#999999"
                : "#d0d0d0";

        track.appendChild(
            connector
        );


        // ----------------------------------------------
        // Event node
        // ----------------------------------------------

        const eventContainer =
            document.createElement(
                "div"
            );

        eventContainer.className =
            "timeline-event";

        eventContainer.style.left =
            `${x}%`;

        eventContainer.style.top =
            `${eventTop}px`;


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "timeline-box";


        if (
            observed
        ) {
            box.style.background =
                attributionColor(
                    currentEvent.importance,
                    maxAbs
                );

            box.style.opacity =
                "1";
        }
        else {
            box.style.background =
                "#D9DDE2";

            box.style.opacity =
                "0.55";
        }


        const label =
            document.createElement(
                "div"
            );

        label.className =
            "timeline-event-label";

        label.textContent =
            fullEvent.activity;


        eventContainer.appendChild(
            box
        );

        eventContainer.appendChild(
            label
        );

        track.appendChild(
            eventContainer
        );

        // ----------------------------------------------
        // Time since case start
        // ----------------------------------------------

        if (
            Number.isFinite(
                timestamps[0]
            )
            &&
            Number.isFinite(
                timestamp
            )
        ) {
            const timeSinceStartLabel =
                document.createElement(
                    "div"
                );

            timeSinceStartLabel.className =
                "timeline-duration-label";

            timeSinceStartLabel.textContent =
                formatDuration(
                    timestamp
                    - timestamps[0]
                );

            if (
                lane > 0
            ) {
                timeSinceStartLabel.style.top =
                    "42px";
            }
            else {
                timeSinceStartLabel.style.bottom =
                    "32px";
            }

            eventContainer.appendChild(
                timeSinceStartLabel
            );
        }

        // ----------------------------------------------
        // Event timestamp
        // ----------------------------------------------

        if (
            Number.isFinite(
                timestamp
            )
        ) {
            const timestampLabel =
                document.createElement(
                    "div"
                );

            timestampLabel.className =
                "timeline-duration-label";

            timestampLabel.textContent =
                formatTimelineTime(
                    timestamp
                );

            if (
                lane > 0
            ) {
                timestampLabel.style.top =
                    "58px";
            }
            else {
                timestampLabel.style.bottom =
                    "48px";
            }

            eventContainer.appendChild(
                timestampLabel
            );
        }

        // ----------------------------------------------
        // Segment to next event
        // ----------------------------------------------

        if (
            index
            < visibleEvents.length - 1
        ) {
            const nextX =
                positionFor(
                    index + 1
                );

            const line =
                document.createElement(
                    "div"
                );

            line.className =
                "timeline-line";

            line.style.left =
                `${x}%`;

            line.style.width =
                `${
                    Math.max(
                        nextX - x,
                        0
                    )
                }%`;

            line.style.top =
                `${centerY}px`;

            const nextPosition =
                Number(
                    visibleEvents[
                        index + 1
                    ].position
                );

            const edgeKey =
                `${position}-${nextPosition}`;

            const sequenceEdge =
                sequenceEdgeMap.get(
                    edgeKey
                );

            if (sequenceEdge) {
                line.style.background =
                    edgeAttributionColor(
                        sequenceEdge.importance,
                        maxAbs
                    );
            }
            else {
                line.style.background =
                    "#000000";
            }

            track.appendChild(
                line
            );

            // ----------------------------------------------
            // Inter-event time label
            // ----------------------------------------------

            if (
                Number.isFinite(
                    timestamps[index]
                )
                &&
                Number.isFinite(
                    timestamps[index + 1]
                )
            ) {
                const interEventLabel =
                    document.createElement(
                        "div"
                    );

                interEventLabel.className =
                    "timeline-axis-time-label";

                const middleX =
                    (
                        x
                        + nextX
                    ) / 2;

                interEventLabel.style.left =
                    `${middleX}%`;

                interEventLabel.style.top =
                    `${centerY - 24}px`;

                interEventLabel.textContent =
                    formatDuration(
                        timestamps[index + 1]
                        - timestamps[index]
                    );

                interEventLabel.style.fontWeight =
                    "bold";

                track.appendChild(
                    interEventLabel
                );
            }

        }


        // ----------------------------------------------
        // Radial
        // ----------------------------------------------

        const contextFeatures =
            data.context_by_position[
                String(
                    position
                )
            ] || [];


        if (
            observed
            &&
            contextFeatures.length
        ) {
            const radialContainer =
                document.createElement(
                    "div"
                );

            radialContainer.className =
                "timeline-radial";

            radialContainer.style.left =
                `${x}%`;

            radialContainer.style.top =
                `${
                    radialTopForLane(
                        lane
                    )
                }px`;

            track.appendChild(
                radialContainer
            );


            renderRadialPlot(
                radialContainer,
                contextFeatures,
                95
            );
        }
    }


    // ------------------------------------------
    // Timeline zoom
    // ------------------------------------------

    timeline.addEventListener(
        "wheel",
        event => {

            if (!event.ctrlKey) {
                return;
            }

            event.preventDefault();

            const rect =
                timeline.getBoundingClientRect();

            const mouseX =
                event.clientX
                - rect.left;

            const oldZoom =
                state.timelineZoom || 1;

            const oldScrollWidth =
                track.scrollWidth;

            const relativePosition =
                (
                    timeline.scrollLeft
                    + mouseX
                )
                / oldScrollWidth;

            const zoomDirection =
                event.deltaY < 0
                    ? 1.2
                    : 1 / 1.2;

            const newZoom =
                Math.min(
                    Math.max(
                        oldZoom
                        * zoomDirection,
                        1
                    ),
                    8
                );

            state.timelineZoom =
                newZoom;

            track.style.width =
                `${newZoom * 100}%`;

            requestAnimationFrame(
                () => {
                    timeline.scrollLeft =
                        relativePosition
                        * track.scrollWidth
                        - mouseX;
                }
            );
        },
        {
            passive: false
        }
    );


    // ------------------------------------------
    // Timeline drag
    // ------------------------------------------

    let isDragging =
        false;

    let dragStartX =
        0;

    let dragStartScroll =
        0;

    timeline.addEventListener(
        "mousedown",
        event => {

            isDragging =
                true;

            dragStartX =
                event.clientX;

            dragStartScroll =
                timeline.scrollLeft;
        }
    );

    window.addEventListener(
        "mousemove",
        event => {

            if (!isDragging) {
                return;
            }

            const deltaX =
                event.clientX
                - dragStartX;

            timeline.scrollLeft =
                dragStartScroll
                - deltaX;
        }
    );

    window.addEventListener(
        "mouseup",
        () => {
            isDragging =
                false;
        }
    );


    container.appendChild(
        timeline
    );
}

function updateTimelineView(data, prefix, maxAbs) {
    if (!timelineContainer || !data) {
        return;
    }
    const prediction = prefix.predictions["remaining_time"];
    renderTimeline(
        timelineContainer,
        data,
        maxAbs,
        prefix,
        prediction ? prediction.predicted : null
    );
}


/* ==================================================
   Main rendering
================================================== */

function buildDashboardStructure() {
    const container = document.getElementById("views");
    container.innerHTML = "";

    Object.entries(VIEW_CONFIG).forEach(([family, config]) => {
        const card = document.createElement("div");
        card.className = "view-card";
        card.dataset.family = family;

        const header = document.createElement("div");
        header.className = "view-header";

        const title = document.createElement("div");
        title.className = "view-title";
        title.textContent = config.title || family;

        const subtitle = document.createElement("div");
        subtitle.className = "view-subtitle";
        subtitle.textContent = `Contribution to ${cleanTaskName(state.task)}`;

        header.appendChild(title);
        header.appendChild(subtitle);
        card.appendChild(header);

        const content = document.createElement("div");
        content.className = "view-content";
        const diagram = document.createElement("div");
        diagram.className = "diagram-area";
        content.appendChild(diagram);
        card.appendChild(content);
        container.appendChild(card);

        if (config.renderer === "dfg") {
            const wrapper = document.createElement("div");
            wrapper.className = "network-wrapper";
            const networkDiv = document.createElement("div");
            networkDiv.className = "network-container";
            const overlay = document.createElement("div");
            overlay.className = "radial-overlay";
            wrapper.appendChild(networkDiv);
            wrapper.appendChild(overlay);
            diagram.appendChild(wrapper);
            buildActivityNetwork(networkDiv, overlay);
        }
        else if (config.renderer === "network") {
            const wrapper = document.createElement("div");
            wrapper.className = "network-wrapper";
            const networkDiv = document.createElement("div");
            networkDiv.className = "network-container";
            const overlay = document.createElement("div");
            overlay.className = "radial-overlay";
            wrapper.appendChild(networkDiv);
            wrapper.appendChild(overlay);
            diagram.appendChild(wrapper);
            buildResourceNetwork(networkDiv, overlay);
        }
        else if (config.renderer === "timeline") {
            timelineContainer = diagram;
        }
    });

    dashboardInitialized = true;
}

function updateDashboard() {
    if (!dashboardInitialized) {
        buildDashboardStructure();
    }

    const prefix = getPrefix();
    const taskData = getTaskData();
    if (!prefix || !taskData) {
        return;
    }

    document.querySelectorAll(".view-subtitle").forEach(element => {
        element.textContent = `Contribution to ${cleanTaskName(state.task)}`;
    });

    const maxAbs = getTaskMaxAbs(taskData);
    updateActivityView(taskData.activity, prefix, maxAbs);
    updateResourceView(taskData.resource, prefix, maxAbs);
    updateTimelineView(taskData.time, prefix, maxAbs);
}

function renderDashboard() {
    buildDashboardStructure();
    updateDashboard();
}

initializeControls();

renderDashboard();
renderRadialLegend();

</script>
